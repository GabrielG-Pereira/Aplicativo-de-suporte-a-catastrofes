<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        window.setupMap = (elementId, latitude, longitude) => {
            var map = L.map(elementId, {
                zoomControl: false
            }).setView([latitude, longitude], 15);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            // SVG do Marcador Amarelo (Pin)
            const pinSvg = `
        <svg viewBox="0 0 24 24" width="40" height="40" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0C7.58 0 4 3.58 4 8c0 5.25 7 13 8 16 1-3 8-10.75 8-16 0-4.42-3.58-8-8-8z" fill="#F0A500"/>
            <circle cx="12" cy="8" r="3" fill="white"/>
        </svg>`;

            var customIcon = L.divIcon({
                className: 'custom-pin',
                html: pinSvg,
                iconSize: [40, 40],    // Tamanho do ícone
                iconAnchor: [20, 40]   // Ajusta para a ponta do pin ficar no local exato (metade da largura, total da altura)
            });

            L.marker([latitude, longitude], { icon: customIcon }).addTo(map);
        };
    </script>


    <link rel="stylesheet" href="_content/Soteria.UI.Shared/soteria-theme.css" />
    <link rel="stylesheet" href="_content/Soteria.UI.Shared/Soteria.UI.Shared.bundle.scp.css" />
    <link rel="stylesheet" href="Soteria.Public.UI..css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Soteria.Doador</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="Soteria.Doador.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
